function fmt(t){let out=[],ul=false;for(const l of esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split('\n')){const s=l.trim();
 if(/^[*-] /.test(s)){if(!ul){out.push('<ul>');ul=true}out.push(`<li>${s.slice(2)}</li>`)}else{if(ul){out.push('</ul>');ul=false}if(s)out.push(`<p>${s}</p>`)}}
 if(ul)out.push('</ul>');return out.join('')}

async function send(){const i=$('cin'),q=i.value.trim();if(!q)return;i.value='';$('cs').style.display='none';$('csend').disabled=true;
 add('u',esc(q));hist.push({role:'user',text:q});const w=add('b','Thinking...');
 try{const r=await fetch(PROXY_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,history:hist.slice(-6)})});
  const d=await r.json();if(!r.ok||d.error)throw new Error(d.error||'HTTP '+r.status);
  hist.push({role:'model',text:d.answer});w.innerHTML=fmt(d.answer)}
 catch(e){w.innerHTML='Jarvis is unavailable right now ('+esc(e.message)+'). Email <a href="mailto:'+EMAIL+'" style="color:var(--c)">'+EMAIL+'</a> instead.'}
 $('csend').disabled=false;i.focus()}

/* ===== Video sequence. Timestamps in seconds, from your video ===== */
const CFG={HOLD:3.0,   /* pause on the "Click to open" card */
 REVEAL:14.2};         /* panels fly out once the big screen has nearly settled; the video then runs on and freezes on its last frame */
const v=$('v'),go=$('go'),fld=$('holo'),mm=$('mm');let st='intro';
mm.innerHTML=Object.entries(S).map(([k,x])=>`<button data-k="${k}">${x.t}</button>`).join('');
mm.addEventListener('click',e=>{const b=e.target.closest('button');if(b)open_(b.dataset.k)});
const END=()=>Math.max(0,(v.duration||16.75)-.05);
function reveal(){fld.classList.add('show');mm.classList.add('show');document.body.classList.add('on');setTimeout(()=>fld.classList.add('done'),2600)}
function begin(){const p=v.play();if(p)p.catch(()=>$('st').classList.add('on'))}
function skip(){go.classList.remove('on');st='end';v.pause();v.readyState<1?v.addEventListener('loadedmetadata',()=>{v.currentTime=END()},{once:true}):v.currentTime=END();reveal()}
function replay(){fld.classList.remove('show','done');mm.classList.remove('show');document.body.classList.remove('on');close_();st='intro';v.currentTime=0;begin()}
go.onclick=()=>{go.classList.remove('on');st='play';begin()};
$('sk').onclick=skip;$('rp').onclick=replay;$('st').onclick=()=>{$('st').classList.remove('on');v.play()};
v.onended=()=>{st='end'};
(function tick(){const t=v.currentTime;
 if(st==='intro'&&t>=CFG.HOLD){v.pause();v.currentTime=CFG.HOLD;st='wait';go.classList.add('on');go.focus({preventScroll:true})}
 else if(st==='play'&&t>=CFG.REVEAL){st='end';reveal()}
 requestAnimationFrame(tick)})();
if(matchMedia('(prefers-reduced-motion:reduce)').matches)skip();else begin();
